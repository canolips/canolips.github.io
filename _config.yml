# Hexo Configuration
# Site
title: Canolips
subtitle: ''
description: 'Canolips 的个人博客 - 记录生活、分享技术、展示视频'
keywords: [博客, 技术, 生活, 视频]
author: Canolips
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://canolips.com
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
future: true
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Home page
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Extensions
theme: fluid

# Deployment
deploy:
  type: git
  repo: https://github.com/canolips/canolips.github.io
  branch: gh-pages
